apply plugin: 'com.android.library'
// AGP 9 ships built-in Kotlin support and registers the `kotlin` extension
// itself. Applying the Kotlin plugin on top of it fails configuration with
// "Cannot add extension with name 'kotlin'". Only apply it when nothing has
// registered that extension yet.
if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'kotlin-android'
}

group = 'expo.modules.googlesignin'
version = '0.5.0'

android {
    namespace 'expo.modules.googlesignin'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk 21
        targetSdk rootProject.ext.targetSdkVersion
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// `android.kotlinOptions` is registered only by kotlin-android, which the guard
// above skips under AGP 9 — the block would fail with "Could not find method
// kotlinOptions()". `kotlin.compilerOptions` resolves on both paths: KGP and
// AGP's built-in Kotlin each register `kotlin` as a KotlinAndroidProjectExtension.
kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    implementation project(':expo-modules-core')
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'com.google.android.gms:play-services-base:18.5.0'
    // AuthorizationClient — Credential Manager returns ID tokens only, so OAuth
    // scopes and access tokens come from this separate Identity API.
    implementation 'com.google.android.gms:play-services-auth:21.6.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
